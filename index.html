<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Federal Site</title>

<style>
body {
    margin: 0;
    height: 100vh;
    background: radial-gradient(circle at top, #1a1a1a, #000);
    font-family: Arial, sans-serif;
    color: white;
    overflow: hidden;
}

/* ENTER SCREEN */
#enter {
    position: fixed;
    inset: 0;
    background: black;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 999;
    cursor: pointer;
}

#enter h1 {
    font-size: 35px;
    animation: pulse 1.5s infinite;
}

@keyframes pulse {
    50% {
        opacity: .5;
    }
}


/* CARD */
.card {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    text-align: center;
    padding: 30px;
    width: 300px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 15px;
    backdrop-filter: blur(10px);
}

img {
    width: 90px;
    height: 90px;
    border-radius: 50%;
}

.button {
    display: block;
    margin: 10px 0;
    padding: 10px;
    background: #5865F2;
    color: white;
    text-decoration: none;
    border-radius: 8px;
}

.button:hover {
    background: #4752c4;
}


/* MUSIC BAR */
.music-player {
    position: fixed;
    bottom: 0;
    width: 100%;
    padding: 12px;
    background: rgba(0,0,0,.6);
    text-align: center;
}
</style>

</head>


<body>


<!-- CLICK TO START -->
<div id="enter" onclick="startMusic()">
    <h1>CLICK TO ENTER SITE</h1>
</div>


<div class="card">

<img src="https://i.imgur.com/TLPb3go.jpeg" alt="PFP">

<h1>Federal</h1>

<p>discord is: f0deral</p>
<p>I Don't Answer A Lot</p>


<a class="button" href="https://discord.gg/vRr8jgraW6" target="_blank">
Discord Server
</a>


<a class="button" href="https://t.me/youralarpnigga" target="_blank">
Telegram
</a>


<br>
I Will Update If Things Change

</div>


<!-- MUSIC -->
<audio id="song" loop>
    <source src="./mrpopular.mp3" type="audio/mpeg">
</audio>


<div class="music-player">
Music Called "Mr Popular"
</div>



<script>

const song = document.getElementById("song");
const enter = document.getElementById("enter");

song.volume = 1.0;


function startMusic(){

    song.play();

    enter.style.display = "none";

}

</script>


</body>
</html>
